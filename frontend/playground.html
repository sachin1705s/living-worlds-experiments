<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drawing to live</title>
    <link rel="stylesheet" href="/src/playground.css" />
    <link rel="stylesheet" href="/src/demo-buttons.css" />
  </head>
  <body>
    <div id="layout">
      <aside id="panel">
        <header>
          <h1>Drawing to live</h1>
          <a href="/showcase.html" class="back">&larr; Back</a>
        </header>

        <section>
          <h2>Your drawing</h2>
          <input type="file" id="seed-file" accept="image/*" />
          <img id="seed-preview" alt="Your drawing" />
        </section>

        <section>
          <h2>What should happen</h2>
          <div class="choices">
            <button id="btn-step" class="choice" type="button" aria-pressed="false" disabled>
              <strong>Step into your drawing</strong>
              <span>Walk around inside it. WASD moves, arrow keys look.</span>
            </button>
            <button id="btn-live" class="choice" type="button" aria-pressed="false" disabled>
              <strong>Make your drawing come to life</strong>
              <span>Watch the picture start to move on its own.</span>
            </button>
          </div>
        </section>

        <section class="actions">
          <button id="btn-stop" class="demo-button demo-button--stop" type="button">Stop</button>
          <button id="btn-reset" class="demo-button demo-button--secondary" disabled>Reset Session</button>
        </section>
      </aside>

      <main id="stage">
        <video id="world-video" autoplay muted playsinline></video>
        <div id="controls-hint" hidden>WASD &mdash; Move &nbsp;&middot;&nbsp; Arrows &mdash; Look</div>
      </main>
    </div>
    <script type="module" src="/src/playground.js"></script>
  </body>
</html>
