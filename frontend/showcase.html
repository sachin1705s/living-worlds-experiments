<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An evolving collection of playable world and character model experiments." />
    <title>Worlds / An interactive model playground</title>
  </head>
  <body>
    <header class="nav"><a class="brand" href="/showcase.html">worlds<span>✳</span></a><span class="nav-note">A COLLECTION OF INTERACTIVE EXPERIMENTS</span></header>
    <main>
      <section class="hero"><h1><em>What if,</em> media is not<br />something you just watch?</h1><div class="hero-bottom"><p>Step into a sketch. Meet a character. Get your next big idea taken down a peg. A growing collection of models you can actually play with.</p></div><span class="hero-mark" aria-hidden="true">✳</span></section>
      <section id="experiments">
        <div class="grid">
          <button class="demo-card" data-demo="drawing"><div class="art sketch"><img class="demo-cover" src="/thumbnails/drawing-to-live.png" alt="A crayon drawing becoming a three-dimensional cottage landscape" loading="lazy" /></div><div class="card-body"><h3>Drawing to live</h3><p>Step inside it, or bring it to life.</p></div></button>
          <button class="demo-card" data-demo="visco"><div class="art character"><img class="einstein-art" src="/einstein/reference.jpg" alt="Einstein in his classroom" /></div><div class="card-body"><h3>Einstein’s Chalkboard</h3><p>Ask Einstein. Watch him explain.</p></div></button>
          <button class="demo-card" data-demo="roast"><div class="art roast"><img class="demo-cover" src="/thumbnails/tech-roast.png" alt="An animated professor roasting a startup pitch" loading="lazy" /></div><div class="card-body"><h3>Tech Roast</h3><p>Pitch your idea. Get roasted.</p></div></button>
          <button class="demo-card" data-demo="stylized"><div class="art stylized"><img class="demo-cover" src="/thumbnails/stylized-worlds.png" alt="Stylized Worlds transforming a hand-framed camera view" loading="lazy" /></div><div class="card-body"><h3>Stylized Worlds</h3><p>Frame it. Change the style.</p></div></button>
          <button class="demo-card" data-demo="drip"><div class="art drip-art"><img class="demo-cover" src="/vidu/virtual-try-on/sequin-tux.jpg" alt="" loading="lazy" /></div><div class="card-body"><h3>Check Your Drip</h3><p>Pick a look. Try it on.</p></div></button>
          <button class="demo-card" data-demo="news"><div class="art news-art"><img class="demo-cover" src="/news/thumbnail.png" alt="R24 news anchor presenting a live broadcast" loading="lazy" /></div><div class="card-body"><h3>News Studio</h3><p>Your own live news channel.</p></div></button>
          <button class="demo-card" data-demo="kahani"><div class="art kahani-art"><img class="demo-cover" src="/thumbnails/kahani.png" alt="" loading="lazy" /></div><div class="card-body"><h3>Kahani</h3><p>Tell the rabbit what to do.</p></div></button>
        </div>
      </section>
      <footer><span>made with ❤️ by <a href="https://x.com/MaxMill06" target="_blank" rel="noopener noreferrer">Sachin</a></span></footer>
    </main>
    <dialog id="demo-dialog" aria-labelledby="demo-title"><div class="dialog-heading"><div><span id="demo-provider" class="eyebrow"></span><h2 id="demo-title"></h2></div><button id="close-demo" class="demo-back" aria-label="Back to demos and stop session">← Back</button></div><div id="demo-content"></div></dialog>
    <script type="module" src="/src/showcase.js"></script>
  </body>
</html>
